#
# nginx para el Taller SmartOLT.
#
# Sirve el frontend compilado y hace de proxy hacia el middleware en /api.
# El middleware NUNCA se expone directo a internet: solo se llega por acá.
#
# Después de instalar, corré certbot para el HTTPS:
#   certbot --nginx -d TU-DOMINIO
#

server {
    listen 80;
    listen [::]:80;

    # Cambiá esto por tu dominio. Con "_" responde a cualquier nombre.
    server_name _;

    root /opt/smartolt/web/dist;
    index index.html;

    # La app es una SPA con react-router: cualquier ruta que no sea un archivo
    # real tiene que devolver index.html, o al recargar en /onus da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre, así que se pueden cachear fuerte.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las operaciones contra una OLT abren una sesión SSH y encadenan varios
        # comandos: pueden pasar del minuto. Con los 60s por defecto, nginx corta
        # la respuesta a mitad de un aprovisionamiento.
        proxy_connect_timeout 15s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Sin buffering para que los errores lleguen apenas ocurren.
        proxy_buffering off;
    }

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
