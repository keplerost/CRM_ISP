#
# nginx para el Taller SmartOLT, detrás del proxy de Cloudflare.
#
# ── Cuándo usar ESTE en vez de nginx-smartolt.conf ──
#
# Cuando el dominio está en Cloudflare con la nube naranja. Ahí el visitante no
# llega a este servidor: llega a Cloudflare, que termina el TLS y vuelve a
# cifrar hacia acá con un certificado de origen.
#
# Se nota enseguida: el dominio resuelve a IPs de Cloudflare (104.x, 172.67.x) y
# no a la del servidor, y si nginx no escucha en 443 el sitio da **error 521**.
#
# ── Antes de instalarlo hacen falta dos archivos ──
#
# En el panel: SSL/TLS → Origin Server → Create Certificate. Dura 15 años, así
# que no hay renovación que se olvide. Guardar así:
#
#     /etc/ssl/cloudflare/origen.pem     el certificado
#     /etc/ssl/cloudflare/origen.key     la clave privada, con chmod 600
#
# Y el modo de Cloudflare tiene que quedar en **Full (strict)**. Con "Flexible"
# el tramo Cloudflare→servidor viaja SIN CIFRAR por internet, y por ahí pasan
# las contraseñas de las OLTs y los routers.
#
# ── Cómo aplicarlo ──
#
#     cp deploy/nginx-cloudflare.conf /etc/nginx/sites-available/smartolt
#     sed -i 's/TU-DOMINIO/crm.tudominio.com/g' /etc/nginx/sites-available/smartolt
#     nginx -t && systemctl reload nginx
#
# Copiar el archivo y no pegar su contenido en la consola: las consolas web de
# los proveedores mezclan las líneas de los pegados largos, y el resultado puede
# quedar sintácticamente válido pero incompleto — que es peor que un error,
# porque `nginx -t` lo aprueba.
#

# La IP real del visitante viene en CF-Connecting-IP; $remote_addr es Cloudflare.
# Sin esto, la auditoría del sistema registra siempre la misma IP y deja de
# servir para saber quién hizo qué.
map $http_cf_connecting_ip $ip_visitante {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    listen [::]:80;
    server_name TU-DOMINIO;

    # Todo a HTTPS. Sobre HTTP el navegador no da cámara ni GPS, así que la foto
    # de ingreso del técnico y la ubicación no funcionarían.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name TU-DOMINIO;

    # El certificado de origen. Solo lo valida Cloudflare — el visitante ve el
    # de ellos, no éste.
    ssl_certificate     /etc/ssl/cloudflare/origen.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origen.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/smartolt/web/dist;
    index index.html;

    # La app es una SPA con react-router: cualquier ruta que no sea un archivo
    # real tiene que devolver index.html, o al recargar en /onus da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre, así que se pueden cachear fuerte.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El service worker NO se cachea.
    #
    # Si queda uno viejo guardado, el técnico sigue abriendo una versión
    # anterior de la app y no hay forma de sacarlo de ahí sin que borre los
    # datos del sitio a mano — que es justo lo que no va a hacer parado en la
    # calle.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $ip_visitante;
        proxy_set_header X-Forwarded-For   $ip_visitante;
        # Siempre https: acá llega en claro desde Cloudflare, pero el visitante
        # vino por HTTPS y es lo que el sistema tiene que registrar.
        proxy_set_header X-Forwarded-Proto https;

        # Las operaciones contra una OLT abren una sesión SSH y encadenan varios
        # comandos: pueden pasar del minuto. Con los 60s por defecto, nginx corta
        # la respuesta a mitad de un aprovisionamiento.
        proxy_connect_timeout 15s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Sin buffering para que los errores lleguen apenas ocurren.
        proxy_buffering off;
    }

    # 8 MB y no 2: por acá pasan las fotos de ingreso de la jornada y las del
    # expediente de venta. Se comprimen a 1280 px antes de subir, pero un
    # teléfono con una cámara generosa se acerca al límite viejo.
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
